# Fortinet FortiGate Firewall Sample Configuration
config system global
    set hostname "FortiGate-Edge-01"
    set timezone 04
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.254 255.255.255.0
        set allowaccess ping https ssh http telnet
        set type physical
    next
end
config system password-policy
    set status disable
    set minimum-length 8
end
